name: Build documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

env:
  DOCKER_VERSION: '241.18775'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: br
            instance: Writerside/br
            artifact: webHelpBR2-all.zip
          - language: es
            instance: Writerside/es
            artifact: webHelpES2-all.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ${{ matrix.language }} documentation
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ matrix.instance }}
          artifact: ${{ matrix.artifact }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Test ${{ matrix.language }} documentation
        continue-on-error: true
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ matrix.instance }}

      - name: Save ${{ matrix.language }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.language }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: artifacts
          merge-multiple: true

      - name: Assemble multilingual site
        run: |
          mkdir -p site site/es
          unzip -O UTF-8 -qq artifacts/webHelpBR2-all.zip -d site
          unzip -O UTF-8 -qq artifacts/webHelpES2-all.zip -d site/es
          cp Writerside/versions.json site/versions.json
          cp site/br-glossario.html site/communique5.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=communique5.html"><title>Communique 5.3</title><a href="communique5.html">Abrir documentação</a>\n' > site/index.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=es-glosario.html"><title>Communique 5.3 ES</title><a href="es-glosario.html">Abrir documentación</a>\n' > site/es/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
